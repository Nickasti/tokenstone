<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acropoli — cantiere pericleo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<!-- three.js come modulo ES: qui GLTFLoader e RGBELoader sono disponibili -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>
:root{
  --notte:#0B141D; --marmo:#E9DDC3; --marmo2:#BCAA85;
  --patina:#74AC9B; --minio:#BE5B40;
  --soft:rgba(233,221,195,.52); --softer:rgba(233,221,195,.24);
  --line:rgba(116,172,155,.26); --panel:rgba(11,20,29,.74);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--notte)}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--marmo);-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;display:block;touch-action:none}

header{position:fixed;top:0;left:0;padding:24px 28px;z-index:5;pointer-events:none}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--patina);margin-bottom:9px}
h1{font-family:'Fraunces',serif;font-weight:300;font-size:clamp(34px,5.6vw,60px);line-height:.9;letter-spacing:-.02em}
.sub{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:var(--soft);margin-top:9px}

#phases{position:fixed;top:24px;right:28px;z-index:5;width:252px;max-height:calc(100vh - 190px);
  background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:2px;
  padding:15px 15px 11px;display:flex;flex-direction:column}
#phases h2{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.24em;
  text-transform:uppercase;color:var(--patina);margin-bottom:12px;flex:none}
#phlist{overflow-y:auto;flex:1;margin-right:-6px;padding-right:6px}
#phlist::-webkit-scrollbar{width:2px}
#phlist::-webkit-scrollbar-thumb{background:var(--line)}
.bld{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--softer);margin:12px 0 7px;padding-top:8px;border-top:1px solid rgba(233,221,195,.08)}
.bld:first-child{margin-top:0;padding-top:0;border-top:0}
.ph{margin-bottom:9px;opacity:.38;transition:opacity .4s}
.ph.on,.ph.done{opacity:1}
.ph-h{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.ph-y{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--patina);min-width:52px}
.ph-t{font-size:12px;flex:1}
.ph-c{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--softer)}
.bar{height:2px;background:rgba(233,221,195,.09);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--patina);transition:width .35s cubic-bezier(.2,.8,.3,1)}
.ph.done .bar i{background:var(--marmo2)}
#note{font-size:11px;line-height:1.5;color:var(--soft);border-top:1px solid var(--line);padding-top:10px;margin-top:8px;flex:none}

#dock{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:6;
  width:min(600px,calc(100vw - 36px));background:var(--panel);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:2px}
.row1{display:flex;border-bottom:1px solid var(--line)}
.tok{padding:12px 17px;border-right:1px solid var(--line);min-width:150px}
.lbl{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--patina);margin-bottom:5px}
.tokval{font-family:'Fraunces',serif;font-weight:500;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
#toksrc{font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--softer);margin-top:5px}
/* il cantiere sta stimando qualche prezzo: va detto, senza allarmare */
#tokwarn{font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:#cfa66b;margin-top:3px;cursor:help}
.next{padding:12px 17px;flex:1;min-width:0}
.mark{font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desc{font-size:11px;color:var(--soft);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* I comandi manuali sono roba da cantiere: il visitatore guarda e basta,
   il cantiere si posa da solo. Compaiono aprendo la pagina con ?dev */
.row2{display:none;gap:1px;background:var(--line)}
body.dev .row2{display:flex}
button{font-family:'IBM Plex Sans',sans-serif;font-size:11.5px;color:var(--marmo);
  background:rgba(11,20,29,.5);border:0;padding:12px 6px;cursor:pointer;flex:1;transition:background .18s,color .18s}
button:hover:not(:disabled){background:rgba(116,172,155,.16)}
button:focus-visible{outline:2px solid var(--patina);outline-offset:-2px}
button:disabled{color:var(--softer);cursor:default}
button.key{background:rgba(116,172,155,.14);font-weight:500;flex:2}
button.key:hover:not(:disabled){background:rgba(116,172,155,.3)}
button.act{background:var(--patina);color:var(--notte);font-weight:500}
.row3{display:flex;justify-content:space-between;align-items:center;padding:8px 17px;
  border-top:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;color:var(--softer)}
.row3 button{all:unset;cursor:pointer;letter-spacing:.12em}
.row3 button:hover{color:var(--patina)}

#solar{position:fixed;left:28px;bottom:24px;z-index:5;width:250px;
  background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);
  border-radius:2px;padding:12px 15px 13px}
#solar .lbl{margin-bottom:7px}
#solarval{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--soft);margin-bottom:9px}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:14px}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:rgba(233,221,195,.16)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;margin-top:-4px;
  border-radius:50%;background:var(--patina);cursor:pointer}
input[type=range]::-moz-range-track{height:2px;background:rgba(233,221,195,.16)}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border:0;border-radius:50%;background:var(--patina);cursor:pointer}

#boot{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:var(--notte);font-family:'IBM Plex Mono',monospace;font-size:11px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--patina);transition:opacity .6s}
#boot.gone{opacity:0;pointer-events:none}
/* un cantiere che non parte deve dirlo, non restare a schermata fissa */
#boot.err{color:#d98b6a;letter-spacing:.08em;text-transform:none;padding:0 32px;text-align:center;
  font-size:12px;line-height:1.7;max-width:760px;margin:0 auto;inset:0}

@media (max-width:900px){
  header{padding:16px 18px}
  #phases{top:auto;right:16px;left:16px;width:auto;bottom:200px;max-height:44vh;display:none}
  #phases.open{display:flex}
  #solar{display:none}
  #dock{bottom:14px;width:calc(100vw - 28px)}
  .tok{min-width:122px;padding:10px 13px}
  .next{padding:10px 13px}
}
@media (prefers-reduced-motion:reduce){ .bar i{transition:none} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<header>
  <div class="eyebrow">Cantiere procedurale · Atene</div>
  <h1>Acropoli</h1>
  <div class="sub">IL PROGRAMMA DI PERICLE · 456 — 406 A.C.</div>
</header>

<aside id="phases">
  <h2>Sequenza di cantiere</h2>
  <div id="phlist"></div>
  <div id="note"></div>
</aside>

<div id="solar">
  <div class="lbl">Ora ad Atene · 25 agosto</div>
  <div id="solarval">—</div>
  <input type="range" id="hour" min="4.5" max="20.5" step="0.1" value="8.4"
         aria-label="Ora del giorno">
</div>

<div id="dock">
  <div class="row1">
    <div class="tok">
      <div class="lbl">Credito · TE</div>
      <div class="tokval" id="tokval">—</div>
      <div id="toksrc">—</div>
      <div id="tokwarn" hidden></div>
    </div>
    <div class="next">
      <div class="lbl">Prossimo blocco</div>
      <div class="mark" id="mark">—</div>
      <div class="desc" id="desc">—</div>
    </div>
  </div>
  <div class="row2">
    <button class="key" id="build">Posa il blocco</button>
    <button id="auto">Cantiere continuo</button>
    <button id="add">+ credito</button>
  </div>
  <div class="row3">
    <span id="prog">0 / 0 blocchi</span>
    <span>
      <button id="fly">VOLA AL CANTIERE</button> ·
      <button id="reset">RIPARTI</button> ·
      <button id="tog">FASI</button>
    </span>
  </div>
</div>

<div id="boot">Taglio dei blocchi in corso…</div>

<script type="module">
  /* La schermata di avvio va tolta da fuori del modulo che carica la scena:
     se l'import fallisce, il codice che sta dentro non gira piu e la scritta
     resterebbe li per sempre, senza dire cosa e andato storto. */
  const boot = document.getElementById('boot');
  const fallito = (msg) => {
    boot.classList.remove('gone');
    boot.classList.add('err');
    boot.textContent = 'Il cantiere non si apre: ' + msg +
      '  —  la console del browser (F12) ha il dettaglio.';
  };
  addEventListener('error', e => { if (e instanceof ErrorEvent) fallito(e.message); });
  addEventListener('unhandledrejection', e =>
    fallito((e.reason && e.reason.message) || 'una promessa e stata rifiutata'));

  import('./src/main.js')
    .then(() => setTimeout(() => boot.classList.add('gone'), 400))
    .catch(err => fallito(err.message));
</script>
</body>
</html>
