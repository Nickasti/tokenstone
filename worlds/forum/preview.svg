<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <!-- Sagoma del Foro Romano, finche il mondo non ha una scena: un arco
       trionfale e le colonne superstiti di un tempio, sul fondo del Palatino. -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2733"/>
      <stop offset="1" stop-color="#36393A"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#cielo)"/>
  <path d="M0,640 Q300,560 620,600 T1600,580 V1000 H0 z" fill="#3B3A33"/>
  <rect y="740" width="1600" height="260" fill="#4A463C"/>
  <!-- l'arco: tre fornici, attico in alto -->
  <rect x="300" y="430" width="420" height="310" fill="#C9BE9F"/>
  <rect x="290" y="390" width="440" height="50" fill="#D9CFB2"/>
  <path d="M440,740 v-150 a70,70 0 0 1 140,0 v150 z" fill="#2B3036"/>
  <path d="M335,740 v-90 a30,30 0 0 1 60,0 v90 z" fill="#2B3036"/>
  <path d="M625,740 v-90 a30,30 0 0 1 60,0 v90 z" fill="#2B3036"/>
  <!-- le colonne del tempio, con il pezzo di trabeazione che resta -->
  <rect x="980" y="330" width="380" height="36" fill="#DDD3B6"/>
  <rect x="990" y="366" width="360" height="22" fill="#C9BE9F"/>
  <rect x="1000" y="388" width="46" height="352" fill="#E2D8BC"/>
  <rect x="1150" y="388" width="46" height="352" fill="#E2D8BC"/>
  <rect x="1300" y="388" width="46" height="352" fill="#E2D8BC"/>
</svg>
